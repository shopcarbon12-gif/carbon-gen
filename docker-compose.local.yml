# Local Postgres for development when Coolify DB is unreachable
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - carbon_gen_postgres_data:/var/lib/postgresql/data

volumes:
  carbon_gen_postgres_data:
